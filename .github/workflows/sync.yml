name: Zambeel to Shopify 24/7 Agent Sync

on:
  workflow_dispatch:
  schedule:
    # Har 6 ghante baad automatically chalega
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Zambeel Products
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_NAME: "Zambeel Products"
          ZAMBEEL_API_KEY: ${{ secrets.ZAMBEEL_API_KEY }}
        run: python zambeel_fetcher.py

      - name: Run Sync Agent
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: ${{ secrets.SHOPIFY_SHOP_URL }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_NAME: "Zambeel Products"
        run: python sync_agent.py
